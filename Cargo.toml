[package]
name = "tohru"
version = "0.1.0"
edition = "2024"
description = "Home directory maid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[[bin]]
name = "tohru"
path = "src/main.rs"
